name: Tests

on:
  push:
    branches:
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: symcon/SymconStubs
          ref: f5a55625da66d7ac152a6400ad978bae664cc2be
          path: tests/stubs
          persist-credentials: false
      - uses: Burki24/Symcon_ModuleCI/php-tests@v1.0.0
        with:
          php-extensions: curl
          setup-python: 'false'
          init-submodules: 'false'
